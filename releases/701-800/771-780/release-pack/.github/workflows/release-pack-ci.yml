name: Releases 771-780 pack CI
on:
  pull_request:
    paths:
      - 'releases/701-800/771-780/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node releases/701-800/771-780/release-pack/scripts/validate-release-pack.mjs
      - run: node --test releases/701-800/771-780/release-pack/tests/*.test.mjs
