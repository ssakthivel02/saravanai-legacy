name: Releases 241-250 pack CI
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node releases/221-260/241-250/release-pack/scripts/validate-release-pack.mjs
      - run: node --test releases/221-260/241-250/release-pack/tests/*.test.mjs
