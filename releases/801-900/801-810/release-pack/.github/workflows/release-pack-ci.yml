name: Releases 801-810 pack CI
on:
  pull_request:
    paths:
      - 'releases/801-900/801-810/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node releases/801-900/801-810/release-pack/scripts/validate-release-pack.mjs
      - run: node --test releases/801-900/801-810/release-pack/tests/*.test.mjs
