name: Runtime Wave 4 validation
on:
  pull_request:
    paths:
      - 'src/entry.js'
      - 'src/runtime-wave4.js'
      - 'src/runtime-v4/**'
      - 'tests/runtime-wave4.test.mjs'
      - 'scripts/validate-runtime-wave4.mjs'
      - 'migrations/0006_runtime_wave4.sql'
      - 'openapi/sakthiai-runtime-wave4.yaml'
      - 'docs/RUNTIME_WAVE_4_*.md'
      - '.github/workflows/runtime-wave-4-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing SakthiAI quality gate
        run: npm test
      - name: Runtime Wave 1 regression
        run: node --test tests/runtime-wave1.test.mjs
      - name: Runtime Wave 2 regression
        run: node --test tests/runtime-wave2.test.mjs
      - name: Runtime Wave 3 regression
        run: node --test tests/runtime-wave3.test.mjs
      - name: Runtime Wave 4 structural validation
        run: node scripts/validate-runtime-wave4.mjs
      - name: Runtime Wave 4 focused tests
        run: node --test tests/runtime-wave4.test.mjs
