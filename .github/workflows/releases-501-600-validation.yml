name: Releases 501-600 validation
on:
  pull_request:
    paths:
      - 'releases/501-600/**'
      - '.github/workflows/releases-501-600-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack:
          - '501-510'
          - '511-520'
          - '521-530'
          - '531-540'
          - '541-550'
          - '551-560'
          - '561-570'
          - '571-580'
          - '581-590'
          - '591-600'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pack exists
        run: test -f releases/501-600/${{ matrix.pack }}/release-pack/scripts/validate-release-pack.mjs
      - name: Validate pack
        run: node releases/501-600/${{ matrix.pack }}/release-pack/scripts/validate-release-pack.mjs
      - name: Test pack
        run: node --test releases/501-600/${{ matrix.pack }}/release-pack/tests/*.test.mjs
