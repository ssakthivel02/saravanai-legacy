name: Runtime Wave 1 validation
on:
  pull_request:
    paths:
      - 'src/entry.js'
      - 'src/runtime-wave1.js'
      - 'src/runtime/**'
      - 'tests/runtime-wave1.test.mjs'
      - 'scripts/validate-runtime-wave1.mjs'
      - 'migrations/0003_runtime_wave1.sql'
      - 'openapi/sakthiai-runtime-wave1.yaml'
      - 'docs/RUNTIME_WAVE_1_*.md'
      - '.github/workflows/runtime-wave-1-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing SakthiAI quality gate
        run: npm test
      - name: Runtime Wave 1 structural validation
        run: node scripts/validate-runtime-wave1.mjs
      - name: Runtime Wave 1 focused tests
        run: node --test tests/runtime-wave1.test.mjs
