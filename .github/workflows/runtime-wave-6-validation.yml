name: Runtime Wave 6 validation
on:
  pull_request:
    paths:
      - 'src/entry.js'
      - 'src/runtime-wave6.js'
      - 'src/runtime-v6/**'
      - 'tests/runtime-wave6.test.mjs'
      - 'scripts/validate-runtime-wave6.mjs'
      - 'migrations/0008_runtime_wave6.sql'
      - 'openapi/sakthiai-runtime-wave6.yaml'
      - 'docs/RUNTIME_WAVE_6_*.md'
      - 'docs/adr/ADR-004-METADATA-ONLY-SUPPLY-CHAIN-ASSESSMENT.md'
      - '.github/workflows/runtime-wave-6-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing SakthiAI quality gate
        run: npm test
      - name: Runtime Wave 1 regression
        run: node --test tests/runtime-wave1.test.mjs
      - name: Runtime Wave 2 regression
        run: node --test tests/runtime-wave2.test.mjs
      - name: Runtime Wave 3 regression
        run: node --test tests/runtime-wave3.test.mjs
      - name: Runtime Wave 4 regression
        run: node --test tests/runtime-wave4.test.mjs
      - name: Runtime Wave 5 regression
        run: node --test tests/runtime-wave5.test.mjs
      - name: Runtime Wave 6 structural validation
        run: node scripts/validate-runtime-wave6.mjs
      - name: Runtime Wave 6 focused tests
        run: node --test tests/runtime-wave6.test.mjs
