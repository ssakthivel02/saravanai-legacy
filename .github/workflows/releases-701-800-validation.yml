name: Releases 701-800 validation
on:
  pull_request:
    paths:
      - 'releases/701-800/**'
      - '.github/workflows/releases-701-800-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack:
          - '701-710'
          - '711-720'
          - '721-730'
          - '731-740'
          - '741-750'
          - '751-760'
          - '761-770'
          - '771-780'
          - '781-790'
          - '791-800'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pack exists
        run: test -f releases/701-800/${{ matrix.pack }}/release-pack/scripts/validate-release-pack.mjs
      - name: Validate pack
        run: node releases/701-800/${{ matrix.pack }}/release-pack/scripts/validate-release-pack.mjs
      - name: Test pack
        run: node --test releases/701-800/${{ matrix.pack }}/release-pack/tests/*.test.mjs
