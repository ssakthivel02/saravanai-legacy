name: Releases 061-100 validation
on:
  pull_request:
    paths:
      - 'releases/061-100/**'
      - '.github/workflows/releases-061-100-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: ['061-070', '071-080', '081-090', '091-100']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pack exists
        run: test -f releases/061-100/${{ matrix.pack }}/release-pack/scripts/validate-release-pack.mjs
      - name: Validate pack
        run: node releases/061-100/${{ matrix.pack }}/release-pack/scripts/validate-release-pack.mjs
      - name: Test pack
        run: node --test releases/061-100/${{ matrix.pack }}/release-pack/tests/*.test.mjs
