name: Releases 801-900 validation
on:
  pull_request:
    paths:
      - 'releases/801-900/**'
      - '.github/workflows/releases-801-900-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack:
          - '801-810'
          - '811-820'
          - '821-830'
          - '831-840'
          - '841-850'
          - '851-860'
          - '861-870'
          - '871-880'
          - '881-890'
          - '891-900'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pack exists
        run: test -f releases/801-900/${{ matrix.pack }}/release-pack/scripts/validate-release-pack.mjs
      - name: Validate pack
        run: node releases/801-900/${{ matrix.pack }}/release-pack/scripts/validate-release-pack.mjs
      - name: Test pack
        run: node --test releases/801-900/${{ matrix.pack }}/release-pack/tests/*.test.mjs
