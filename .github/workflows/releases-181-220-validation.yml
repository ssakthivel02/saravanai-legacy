name: Releases 181-220 validation
on:
  pull_request:
    paths:
      - 'releases/181-220/**'
      - '.github/workflows/releases-181-220-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: ['181-190', '191-200', '201-210', '211-220']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pack exists
        run: test -f releases/181-220/${{ matrix.pack }}/release-pack/scripts/validate-release-pack.mjs
      - name: Validate pack
        run: node releases/181-220/${{ matrix.pack }}/release-pack/scripts/validate-release-pack.mjs
      - name: Test pack
        run: node --test releases/181-220/${{ matrix.pack }}/release-pack/tests/*.test.mjs
