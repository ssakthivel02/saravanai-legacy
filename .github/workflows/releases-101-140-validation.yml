name: Releases 101-140 validation
on:
  pull_request:
    paths:
      - 'releases/101-140/**'
      - '.github/workflows/releases-101-140-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack: ['101-110','111-120','121-130','131-140']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pack exists
        run: test -f releases/101-140/${{ matrix.pack }}/release-pack/scripts/validate-release-pack.mjs
      - name: Validate pack
        run: node releases/101-140/${{ matrix.pack }}/release-pack/scripts/validate-release-pack.mjs
      - name: Test pack
        run: node --test releases/101-140/${{ matrix.pack }}/release-pack/tests/*.test.mjs
