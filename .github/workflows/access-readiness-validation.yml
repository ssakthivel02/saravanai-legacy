name: Access readiness and release contract

on:
  pull_request:
    paths:
      - 'src/owner-api.js'
      - 'assets/access-readiness.js'
      - 'assets/access-readiness.css'
      - 'assets/release-labels.js'
      - 'service-worker.js'
      - 'openapi/sakthiai-v1.yaml'
      - 'tests/access-readiness.test.mjs'
      - 'tests/platform-release-contract.test.mjs'
      - 'scripts/validate-access-readiness.mjs'
      - 'docs/BUILD_015_ACCESS_READINESS.md'
      - '.github/workflows/access-readiness-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing SakthiAI validation
        run: npm test
      - name: Build 015 focused tests
        run: node --test tests/access-readiness.test.mjs tests/platform-release-contract.test.mjs
      - name: Build 015 structural safety validation
        run: node scripts/validate-access-readiness.mjs
      - name: Confirm no access or billing activation
        run: |
          ! grep -E '"ACCESS_JWT_ENFORCEMENT_ENABLED"[[:space:]]*:[[:space:]]*"true"' wrangler.jsonc
          ! grep -E '"PUBLIC_REGISTRATION"[[:space:]]*:[[:space:]]*"true"' wrangler.jsonc
          ! grep -E '"PREMIUM_PROVIDERS_ENABLED"[[:space:]]*:[[:space:]]*"true"' wrangler.jsonc
